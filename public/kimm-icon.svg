<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <filter id="glowIcon">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="20" cy="20" r="19" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.3"/>
  <circle cx="20" cy="20" r="15" fill="none" stroke="#10b981" stroke-width="0.3" opacity="0.2"/>
  
  <!-- Mangrove leaf -->
  <path d="M 20 6 Q 26 14 20 22 Q 14 30 20 34 Q 26 30 32 22 Q 38 14 32 6 Q 26 2 20 6 Z" 
        fill="url(#leafGrad)" 
        filter="url(#glowIcon)"
        opacity="0.9"/>
  
  <!-- Circuit veins -->
  <line x1="26" y1="10" x2="26" y2="30" stroke="#a3e635" stroke-width="0.8" opacity="0.7"/>
  <line x1="26" y1="14" x2="21" y2="17" stroke="#a3e635" stroke-width="0.5" opacity="0.6"/>
  <line x1="26" y1="18" x2="31" y2="21" stroke="#a3e635" stroke-width="0.5" opacity="0.6"/>
  <line x1="26" y1="22" x2="21" y2="25" stroke="#a3e635" stroke-width="0.5" opacity="0.6"/>
  <line x1="26" y1="26" x2="31" y2="29" stroke="#a3e635" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Circuit nodes -->
  <circle cx="26" cy="10" r="1.2" fill="#a3e635"/>
  <circle cx="26" cy="18" r="1.2" fill="#a3e635"/>
  <circle cx="26" cy="26" r="1.2" fill="#a3e635"/>
</svg>
