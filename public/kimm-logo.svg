<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circuitGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#a3e635;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Mangrove Leaf Icon -->
  <g transform="translate(10, 10)">
    <!-- Main leaf shape -->
    <path d="M 20 5 Q 25 15 20 25 Q 15 35 20 40 Q 25 35 30 25 Q 35 15 30 5 Q 25 0 20 5 Z" 
          fill="url(#leafGradient)" 
          filter="url(#glow)"
          opacity="0.9"/>
    
    <!-- Leaf veins (circuit-like) -->
    <line x1="25" y1="10" x2="25" y2="35" stroke="#a3e635" stroke-width="0.8" opacity="0.6"/>
    <line x1="25" y1="15" x2="20" y2="18" stroke="#a3e635" stroke-width="0.5" opacity="0.5"/>
    <line x1="25" y1="20" x2="30" y2="23" stroke="#a3e635" stroke-width="0.5" opacity="0.5"/>
    <line x1="25" y1="25" x2="20" y2="28" stroke="#a3e635" stroke-width="0.5" opacity="0.5"/>
    <line x1="25" y1="30" x2="30" y2="33" stroke="#a3e635" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Circuit nodes -->
    <circle cx="25" cy="10" r="1.5" fill="#34d399"/>
    <circle cx="25" cy="20" r="1.5" fill="#34d399"/>
    <circle cx="25" cy="30" r="1.5" fill="#34d399"/>
    
    <!-- Small decorative leaves -->
    <path d="M 10 20 Q 12 22 10 24 Q 8 22 10 20 Z" fill="#10b981" opacity="0.6"/>
    <path d="M 40 15 Q 42 17 40 19 Q 38 17 40 15 Z" fill="#10b981" opacity="0.6"/>
  </g>
  
  <!-- KIMM Text -->
  <text x="60" y="38" font-family="Space Grotesk, sans-serif" font-size="32" font-weight="700" fill="#34d399" letter-spacing="2">
    KIMM
  </text>
  
  <!-- Subtitle -->
  <text x="60" y="52" font-family="JetBrains Mono, monospace" font-size="8" fill="#10b981" letter-spacing="1.5" opacity="0.7">
    KAMPUNG INGGRIS
  </text>
  
  <!-- Decorative circuit lines -->
  <line x1="60" y1="42" x2="180" y2="42" stroke="url(#circuitGradient)" stroke-width="0.5" opacity="0.3"/>
  <circle cx="180" cy="42" r="2" fill="#34d399" opacity="0.6"/>
  
  <!-- Corner accents -->
  <path d="M 5 5 L 5 15 M 5 5 L 15 5" stroke="#10b981" stroke-width="1" opacity="0.4" fill="none"/>
  <path d="M 195 55 L 195 45 M 195 55 L 185 55" stroke="#10b981" stroke-width="1" opacity="0.4" fill="none"/>
</svg>
